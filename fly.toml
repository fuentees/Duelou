# Configuração de deploy da API na Fly.io.
# Antes de publicar o app web: ajustar ALLOWED_ORIGINS pela origem real.
app = "duelou-api"
primary_region = "gru"

[build]
  dockerfile = "server/Dockerfile"

[env]
  ALLOWED_ORIGINS = "http://localhost:8083"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[mounts]
  source = "duelou_data"
  destination = "/data"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
